name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"

permissions:
  contents: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: uipath-core,uipath-platform,uipath-llm-client,uipath-langchain-client

jobs:
  type_check:
    name: Type Check and Lint
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Ruff check
        run: |
          uv run ruff check || exit 1
          uv run ruff format --check || exit 1

      - name: Pyright
        run: uv run pyright .

  import_without_extras:
    name: Import Without Extras
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install without extras
        run: uv sync --no-dev --package uipath-langchain-client

      - name: Import packages
        run: |
          uv run --no-sync python -c "import uipath.llm_client"
          uv run --no-sync python -c "import uipath_langchain_client"

  test:
    name: Test
    runs-on: uipath-ubuntu-latest
    needs: type_check
    environment: LLMGW_SETTINGS
    env:
      UIPATH_LLM_SERVICE: ${{ vars.UIPATH_LLM_SERVICE }}
      LLMGW_URL: ${{ vars.LLMGW_URL }}
      LLMGW_SEMANTIC_ORG_ID: ${{ secrets.LLMGW_SEMANTIC_ORG_ID }}
      LLMGW_SEMANTIC_USER_ID: ${{ secrets.LLMGW_SEMANTIC_USER_ID }}
      LLMGW_SEMANTIC_TENANT_ID: ${{ secrets.LLMGW_SEMANTIC_TENANT_ID }}
      LLMGW_REQUESTING_PRODUCT: ${{ vars.LLMGW_REQUESTING_PRODUCT }}
      LLMGW_REQUESTING_FEATURE: ${{ vars.LLMGW_REQUESTING_FEATURE }}
      LLMGW_CLIENT_ID: ${{ secrets.LLMGW_CLIENT_ID }}
      LLMGW_CLIENT_SECRET: ${{ secrets.LLMGW_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests --cov --cov-report=xml --cov-report=term

      - name: Upload coverage XML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-xml-report
          path: coverage.xml
          retention-days: 30

  sonarcloud:
    name: SonarCloud
    needs: test
    runs-on: uipath-ubuntu-latest
    if: always() && needs.test.result != 'failure'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: coverage-xml-report

      # SONAR_TOKEN is provisioned once by a repo admin. Skip with a warning rather
      # than failing, so a missing or rotated secret never blocks every PR.
      - name: Check for SonarCloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not configured; skipping the SonarCloud scan."
          fi

      - name: SonarCloud Scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
